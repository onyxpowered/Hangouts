<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hangouts</title>
<style>
:root{color-scheme:dark}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#0F0F0F;color:#fff;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
</style>
</head>
<body>
<div id="SecurityStatus">Hangouts — Release Zero (signed)</div>
<script>
const SecurityDatabaseName = "HangoutsSecurity";
const SecurityDatabaseVersion = 2;
const SecuritySessionCacheKey = "HangoutsSessionProof";

function SecurityOpenDatabase() {
  return new Promise((resolve, reject) => {
    const SecurityRequest = indexedDB.open(SecurityDatabaseName, SecurityDatabaseVersion);
    SecurityRequest.onupgradeneeded = () => {
      const SecurityDb = SecurityRequest.result;
      for (const SecurityLegacyStoreName of ["Identities", "Attempts", "Flags"]) {
        if (SecurityDb.objectStoreNames.contains(SecurityLegacyStoreName)) {
          SecurityDb.deleteObjectStore(SecurityLegacyStoreName);
        }
      }
      if (!SecurityDb.objectStoreNames.contains("Keys")) {
        SecurityDb.createObjectStore("Keys", { keyPath: "username" });
      }
      if (!SecurityDb.objectStoreNames.contains("Device")) {
        SecurityDb.createObjectStore("Device", { keyPath: "key" });
      }
    };
    SecurityRequest.onsuccess = () => resolve(SecurityRequest.result);
    SecurityRequest.onerror = () => reject(SecurityRequest.error);
  });
}

function SecurityTransactionStore(SecurityDb, SecurityStoreName, SecurityMode) {
  return SecurityDb.transaction(SecurityStoreName, SecurityMode).objectStore(SecurityStoreName);
}

function SecurityRequestToPromise(SecurityRequest) {
  return new Promise((resolve, reject) => {
    SecurityRequest.onsuccess = () => resolve(SecurityRequest.result);
    SecurityRequest.onerror = () => reject(SecurityRequest.error);
  });
}

function SecurityBufferToHex(SecurityBuffer) {
  return Array.from(new Uint8Array(SecurityBuffer)).map((SecurityByte) => SecurityByte.toString(16).padStart(2, "0")).join("");
}

function SecurityHexToBuffer(SecurityHex) {
  const SecurityBytes = new Uint8Array(SecurityHex.length / 2);
  for (let SecurityIndex = 0; SecurityIndex < SecurityBytes.length; SecurityIndex++) {
    SecurityBytes[SecurityIndex] = parseInt(SecurityHex.substr(SecurityIndex * 2, 2), 16);
  }
  return SecurityBytes;
}

function SecurityNormalizeIdentifier(SecurityUsername) {
  return SecurityUsername.trim().toLowerCase();
}

async function SecurityGetPrivateKey(SecurityIdentifier) {
  const SecurityDb = await SecurityOpenDatabase();
  const SecurityStore = SecurityTransactionStore(SecurityDb, "Keys", "readonly");
  const SecurityRecord = await SecurityRequestToPromise(SecurityStore.get(SecurityIdentifier));
  return SecurityRecord ? SecurityRecord.privateKey : null;
}

function SecuritySessionCanonicalPayload(SecurityEntry) {
  return JSON.stringify({
    username: SecurityEntry.username,
    publicKeyHex: SecurityEntry.publicKeyHex,
    deviceId: SecurityEntry.deviceId,
    createdAt: SecurityEntry.createdAt,
    expiresAt: SecurityEntry.expiresAt
  });
}

async function SecurityDigestPayload(SecurityPayloadString) {
  const SecurityDigest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(SecurityPayloadString));
  return SecurityBufferToHex(SecurityDigest);
}

function SecurityReadSessionCache() {
  const SecurityRaw = localStorage.getItem(SecuritySessionCacheKey);
  if (!SecurityRaw) {
    return null;
  }
  return JSON.parse(SecurityRaw);
}

function SecurityClearSessionCache() {
  localStorage.removeItem(SecuritySessionCacheKey);
}

async function SecurityVerifySessionEntry(SecurityEntry) {
  if (!SecurityEntry.expiresAt || SecurityEntry.expiresAt <= Date.now()) {
    return false;
  }
  const SecurityExpectedChallengeHex = await SecurityDigestPayload(SecuritySessionCanonicalPayload(SecurityEntry));
  if (SecurityExpectedChallengeHex !== SecurityEntry.challengeHex) {
    return false;
  }
  const SecurityPublicKey = await crypto.subtle.importKey(
    "raw",
    SecurityHexToBuffer(SecurityEntry.publicKeyHex),
    { name: "ECDSA", namedCurve: "P-256" },
    false,
    ["verify"]
  );
  return crypto.subtle.verify(
    { name: "ECDSA", hash: "SHA-256" },
    SecurityPublicKey,
    SecurityHexToBuffer(SecurityEntry.signatureHex),
    SecurityHexToBuffer(SecurityEntry.challengeHex)
  );
}

async function SecurityConsumeSession() {
  const SecurityEntry = SecurityReadSessionCache();
  if (!SecurityEntry) {
    return null;
  }
  SecurityClearSessionCache();
  const SecurityValid = await SecurityVerifySessionEntry(SecurityEntry);
  if (!SecurityValid) {
    return null;
  }
  return {
    username: SecurityNormalizeIdentifier(SecurityEntry.username),
    deviceId: SecurityEntry.deviceId,
    publicKeyHex: SecurityEntry.publicKeyHex
  };
}

function SecuritySetStatus(SecurityMessage) {
  document.getElementById("SecurityStatus").textContent = SecurityMessage;
}

async function SecurityRun() {
  const SecuritySession = await SecurityConsumeSession();
  if (!SecuritySession) {
    SecuritySetStatus("No active session — please sign in.");
    return;
  }
  const SecurityPrivateKey = await SecurityGetPrivateKey(SecuritySession.username);
  if (!SecurityPrivateKey) {
    SecuritySetStatus("No active session — please sign in.");
    return;
  }
  SecuritySetStatus(`Signed in as ${SecuritySession.username}`);
}

SecurityRun();
</script>
</body>
</html>
